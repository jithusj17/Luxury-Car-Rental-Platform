# Local infrastructure. `docker compose up -d`
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carrental
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local email inbox: SMTP on :1025, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3-compatible storage for testing the production photo driver (S3 API on :8333).
  # Started on demand: docker compose --profile s3 up -d s3
  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -s3 -s3.port=8333 -dir=/data -volume.max=5
    ports:
      - "8333:8333"
    profiles: ["s3"]

volumes:
  pgdata:
