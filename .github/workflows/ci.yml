name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Same services and ports as docker-compose.yml, so test defaults work unchanged.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carrental
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
      stripe-mock:
        image: stripe/stripe-mock:v0.197.0
        ports:
          - 12111:12111

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The e2e stack serves uploaded photos from localhost (no .env files in CI).
      IMAGES_ALLOW_LOCAL_IP: "true"
      TEST_STRIPE_API_BASE: http://localhost:12111

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Build web app
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter web e2e
        env:
          PW_CHANNEL: chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
