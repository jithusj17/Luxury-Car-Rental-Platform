# Production stack for a single server (VPS). From the repository root:
#   cp deploy/.env.production.example deploy/.env   # fill in every value
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Caddy obtains HTTPS certificates for $DOMAIN automatically (ports 80 and 443 must be open).
name: car-rental

x-api-env: &api-env
  NODE_ENV: production
  PORT: "4000"
  DATABASE_URL: postgres://carrental:${POSTGRES_PASSWORD}@postgres:5432/carrental
  REDIS_URL: redis://redis:6379
  WEB_ORIGINS: ${PUBLIC_URL}
  PUBLIC_API_URL: ${PUBLIC_URL}/api
  TRUST_PROXY: "1"
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  METRICS_TOKEN: ${METRICS_TOKEN}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  PAYMENT_PROVIDER: stripe
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  STRIPE_API_BASE: ${STRIPE_API_BASE:-}
  EMAIL_TRANSPORT: smtp
  SMTP_URL: ${SMTP_URL}
  EMAIL_FROM: ${EMAIL_FROM}
  STORAGE_DRIVER: s3
  STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: ${S3_REGION:-auto}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: carrental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: carrental
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrental"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-off: applies database migrations before the API starts.
  migrate:
    image: car-rental-api:${IMAGE_TAG:-local}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["node", "src/shared/db/migrate.ts"]
    environment:
      DATABASE_URL: postgres://carrental:${POSTGRES_PASSWORD}@postgres:5432/carrental
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: car-rental-api:${IMAGE_TAG:-local}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: car-rental-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        IMAGE_REMOTE_PATTERNS: ${IMAGE_REMOTE_PATTERNS}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
